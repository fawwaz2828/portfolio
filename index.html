<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <!-- Tab icon: FW logo (from public/images/fw.png) on the dark surface -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- open the connection to Supabase (site content) while the page is still loading -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <script>
      // Apply the saved language before first paint
      try { if (localStorage.getItem("lang") === "zh") document.documentElement.lang = "zh-CN"; } catch (e) {}
    </script>
    <title>Fawwaz Akbar Wibowo — Portfolio</title>
    <meta name="description" content="Fawwaz Akbar Wibowo — Software Engineering student building web & mobile apps with a focus on frontend, UI/UX and AI." />
    <meta name="author" content="Fawwaz Akbar Wibowo" />
    <!-- Link previews. og:image / og:url become absolute at build time when
         SITE_URL is set (vite.config.ts); most apps ignore relative image URLs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fawwaz Akbar Wibowo" />
    <meta property="og:title" content="Fawwaz Akbar Wibowo — Portfolio" />
    <meta property="og:description" content="Software engineer in Nanjing building web, mobile and AI products: frontend, UI/UX and the small details. Selected projects, experience and contact." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fawwaz Akbar Wibowo — Locked in. Shipping soon." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fawwaz Akbar Wibowo — Portfolio" />
    <meta name="twitter:description" content="Software engineer in Nanjing building web, mobile and AI products." />
    <meta name="twitter:image" content="/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
